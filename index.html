<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spice">
  <meta name="theme-color" content="#f5f0eb">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Spice</title>
</head>
<body>

<div id="loading" class="visible">
  <div class="spinner"></div>
  <p>Loading pairings…</p>
</div>

<header>
  <h1>Spice</h1>
  <p>Flavour pairing for improvised cooking</p>
</header>

<main>

  <!-- SCREEN 1: INPUT -->
  <div id="screen-input">

    <div class="card">
      <div class="card-label">Ingredients</div>
      <div class="input-wrap">
        <input id="ingredient-input" type="text" placeholder="Type an ingredient…" autocomplete="off" autocorrect="off" spellcheck="false">
        <div id="dropdown"></div>
      </div>
      <div style="height:12px"></div>
      <div id="chips"></div>
      <div style="height:10px"></div>
      <div class="hint" id="count-hint">Add up to 5 ingredients. Tap an ingredient to mark it as main (up to 2).</div>
    </div>

    <button id="btn-submit" disabled>Get pairings</button>

  </div>

  <!-- SCREEN 2: RESULTS -->
  <div id="screen-results">

    <div class="card">
      <div class="card-label">Your ingredients</div>
      <div class="results-ingredients" id="result-ingredients"></div>
    </div>

    <div class="card">
      <div class="card-label">Recommended pairings</div>
      <div class="pairing-list" id="result-pairings"></div>
    </div>

    <div class="card">
      <div class="card-label">Avoid</div>
      <div class="nogo-list" id="result-nogo"></div>
    </div>

    <button id="btn-restart">Start over</button>

  </div>

</main>

<script>
// ── State ────────────────────────────────────────────────────────────────────

let vocabulary = [];
let pairingsDb = [];
let ingredients = []; // [{name, isMain}]
let highlightedIndex = -1;

const MAX_INGREDIENTS = 5;
const MAX_MAIN = 2;
const TOP_N = 15;

const LEVEL_WEIGHTS = {
  holy_grail: 5,
  very_highly_recommended: 4,
  recommended: 3,
  normal: 2,
};

const LEVEL_LABELS = {
  holy_grail: "Holy grail",
  very_highly_recommended: "Very highly recommended",
  recommended: "Recommended",
  normal: "Normal",
};

// ── DOM refs ─────────────────────────────────────────────────────────────────

const $loading       = document.getElementById("loading");
const $screenInput   = document.getElementById("screen-input");
const $screenResults = document.getElementById("screen-results");
const $input         = document.getElementById("ingredient-input");
const $dropdown      = document.getElementById("dropdown");
const $chips         = document.getElementById("chips");
const $submit        = document.getElementById("btn-submit");
const $countHint     = document.getElementById("count-hint");
const $resultIngredients = document.getElementById("result-ingredients");
const $resultPairings    = document.getElementById("result-pairings");
const $resultNogo        = document.getElementById("result-nogo");
const $restart           = document.getElementById("btn-restart");

// ── Data loading ─────────────────────────────────────────────────────────────

async function loadData() {
  const [vocabResp, pairingsResp] = await Promise.all([
    fetch("vocabulary.json"),
    fetch("pairings.json"),
  ]);
  const vocabData = await vocabResp.json();
  vocabulary = vocabData.ingredients;
  pairingsDb = await pairingsResp.json();
  $loading.classList.remove("visible");
}

// ── Autocomplete ─────────────────────────────────────────────────────────────

function getMatches(query) {
  if (!query) return [];
  const q = query.toLowerCase();
  const added = new Set(ingredients.map(i => i.name.toLowerCase()));
  return vocabulary
    .filter(v => !added.has(v.toLowerCase()) && v.toLowerCase().includes(q))
    .slice(0, 8);
}

function showDropdown(matches) {
  if (!matches.length) { hideDropdown(); return; }
  $dropdown.innerHTML = "";
  highlightedIndex = -1;
  matches.forEach((name, i) => {
    const el = document.createElement("div");
    el.className = "dropdown-item";
    el.textContent = name;
    el.addEventListener("mousedown", e => { e.preventDefault(); addIngredient(name); });
    el.addEventListener("touchstart", e => { e.preventDefault(); addIngredient(name); }, {passive: false});
    $dropdown.appendChild(el);
  });
  $dropdown.style.display = "block";
}

function hideDropdown() {
  $dropdown.style.display = "none";
  $dropdown.innerHTML = "";
  highlightedIndex = -1;
}

function moveHighlight(dir) {
  const items = $dropdown.querySelectorAll(".dropdown-item");
  if (!items.length) return;
  items[highlightedIndex]?.classList.remove("highlighted");
  highlightedIndex = (highlightedIndex + dir + items.length) % items.length;
  items[highlightedIndex]?.classList.add("highlighted");
  items[highlightedIndex]?.scrollIntoView({block: "nearest"});
}

$input.addEventListener("input", () => {
  showDropdown(getMatches($input.value.trim()));
});

$input.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveHighlight(1); return; }
  if (e.key === "ArrowUp")   { e.preventDefault(); moveHighlight(-1); return; }
  if (e.key === "Enter") {
    e.preventDefault();
    const items = $dropdown.querySelectorAll(".dropdown-item");
    if (highlightedIndex >= 0 && items[highlightedIndex]) {
      addIngredient(items[highlightedIndex].textContent);
    }
  }
  if (e.key === "Escape") hideDropdown();
});

$input.addEventListener("blur", () => { setTimeout(hideDropdown, 150); });

// ── Ingredient management ────────────────────────────────────────────────────

function addIngredient(name) {
  if (ingredients.length >= MAX_INGREDIENTS) return;
  if (ingredients.some(i => i.name.toLowerCase() === name.toLowerCase())) return;
  ingredients.push({ name, isMain: false });
  $input.value = "";
  hideDropdown();
  renderChips();
  updateSubmit();
}

function removeIngredient(name) {
  ingredients = ingredients.filter(i => i.name !== name);
  renderChips();
  updateSubmit();
}

function toggleMain(name) {
  const ing = ingredients.find(i => i.name === name);
  if (!ing) return;
  const mainCount = ingredients.filter(i => i.isMain).length;
  if (!ing.isMain && mainCount >= MAX_MAIN) return;
  ing.isMain = !ing.isMain;
  renderChips();
}

function renderChips() {
  $chips.innerHTML = "";
  ingredients.forEach(ing => {
    const chip = document.createElement("div");
    chip.className = "chip" + (ing.isMain ? " is-main" : "");

    const nameSpan = document.createElement("span");
    nameSpan.textContent = ing.name;

    const mainBtn = document.createElement("button");
    mainBtn.className = "chip-main-btn";
    mainBtn.textContent = ing.isMain ? "main" : "main?";
    mainBtn.title = ing.isMain ? "Remove main" : "Mark as main";
    mainBtn.addEventListener("click", () => toggleMain(ing.name));

    const removeBtn = document.createElement("button");
    removeBtn.className = "chip-remove";
    removeBtn.textContent = "×";
    removeBtn.title = "Remove";
    removeBtn.addEventListener("click", () => removeIngredient(ing.name));

    chip.appendChild(nameSpan);
    chip.appendChild(mainBtn);
    chip.appendChild(removeBtn);
    $chips.appendChild(chip);
  });

  const remaining = MAX_INGREDIENTS - ingredients.length;
  const mainCount = ingredients.filter(i => i.isMain).length;

  if (ingredients.length === 0) {
    $countHint.textContent = "Add up to 5 ingredients. Tap ‘main?’ on an ingredient to mark it as main (up to 2).";
  } else if (remaining === 0) {
    $countHint.textContent = "Maximum 5 ingredients reached.";
  } else {
    const mainHint = mainCount < MAX_MAIN ? ` Mark up to ${MAX_MAIN - mainCount} more as main.` : "";
    $countHint.textContent = `${remaining} more ingredient${remaining !== 1 ? "s" : ""} can be added.${mainHint}`;
  }

  $input.disabled = ingredients.length >= MAX_INGREDIENTS;
}

function updateSubmit() {
  $submit.disabled = ingredients.length === 0;
}

// ── Recommendation engine ────────────────────────────────────────────────────

function findPairings(ingredientName) {
  const name = ingredientName.toUpperCase();
  return pairingsDb.filter(row => {
    const ing = row.ingredient.toUpperCase();
    return ing === name
      || ing.startsWith(name + " ")
      || ing.startsWith(name + ",")
      || ing.startsWith(name + " —")
      || ing.startsWith(name + " -");
  });
}

function recommend() {
  const mainSet = new Set(ingredients.filter(i => i.isMain).map(i => i.name.toUpperCase()));
  const scores  = {}; // pairing -> { ing -> level }
  const avoid   = {}; // pairing -> [ing, ...]

  ingredients.forEach(ing => {
    const rows = findPairings(ing.name);
    rows.forEach(row => {
      const pairing = row.pairing;
      const level   = row.level;
      if (level === "avoid") {
        if (!avoid[pairing]) avoid[pairing] = [];
        avoid[pairing].push(ing.name);
      } else {
        if (!scores[pairing]) scores[pairing] = {};
        const existing = scores[pairing][ing.name.toUpperCase()];
        if (!existing || (LEVEL_WEIGHTS[level] || 0) > (LEVEL_WEIGHTS[existing] || 0)) {
          scores[pairing][ing.name.toUpperCase()] = level;
        }
      }
    });
  });

  const recommendations = Object.entries(scores).map(([pairing, ingLevels]) => {
    let totalScore = 0;
    let bestLevel = "normal";
    const details = [];
    Object.entries(ingLevels).forEach(([ing, level]) => {
      const weight = LEVEL_WEIGHTS[level] || 1;
      const multiplier = mainSet.has(ing) ? 2 : 1;
      totalScore += weight * multiplier;
      if ((LEVEL_WEIGHTS[level] || 0) > (LEVEL_WEIGHTS[bestLevel] || 0)) bestLevel = level;
      details.push({ ing, level });
    });
    return { pairing, score: totalScore, matches: Object.keys(ingLevels).length, bestLevel, details };
  });

  recommendations.sort((a, b) => b.matches - a.matches || b.score - a.score);

  return {
    recommendations: recommendations.slice(0, TOP_N),
    avoid: Object.entries(avoid).map(([pairing, ings]) => ({ pairing, ings })),
  };
}

// ── Results rendering ────────────────────────────────────────────────────────

function showResults() {
  const result = recommend();

  // Ingredients summary
  $resultIngredients.innerHTML = "";
  ingredients.forEach(ing => {
    const tag = document.createElement("div");
    tag.className = "result-tag" + (ing.isMain ? " is-main" : "");
    tag.textContent = ing.name;
    if (ing.isMain) {
      const lbl = document.createElement("span");
      lbl.className = "main-label";
      lbl.textContent = "main";
      tag.appendChild(lbl);
    }
    $resultIngredients.appendChild(tag);
  });

  // Pairings
  $resultPairings.innerHTML = "";
  if (result.recommendations.length === 0) {
    $resultPairings.innerHTML = '<p class="empty-state">No pairings found for these ingredients.</p>';
  } else {
    result.recommendations.forEach(rec => {
      const item = document.createElement("div");
      item.className = "pairing-item";

      const name = document.createElement("span");
      name.className = "pairing-name";
      name.textContent = rec.pairing;

      const strength = document.createElement("span");
      strength.className = "pairing-strength strength-" + rec.bestLevel;
      strength.textContent = LEVEL_LABELS[rec.bestLevel] || rec.bestLevel;

      item.appendChild(name);
      item.appendChild(strength);
      $resultPairings.appendChild(item);
    });
  }

  // No-go
  $resultNogo.innerHTML = "";
  if (result.avoid.length === 0) {
    $resultNogo.innerHTML = '<p class="empty-state">Nothing to avoid.</p>';
  } else {
    result.avoid.forEach(a => {
      const el = document.createElement("div");
      el.className = "nogo-item";
      el.textContent = a.pairing;
      $resultNogo.appendChild(el);
    });
  }

  $screenInput.style.display   = "none";
  $screenResults.style.display = "flex";
  window.scrollTo(0, 0);
}

function restart() {
  ingredients = [];
  $input.value = "";
  renderChips();
  updateSubmit();
  $screenResults.style.display = "none";
  $screenInput.style.display   = "flex";
  window.scrollTo(0, 0);
  setTimeout(() => $input.focus(), 100);
}

// ── Events ───────────────────────────────────────────────────────────────────

$submit.addEventListener("click", showResults);
$restart.addEventListener("click", restart);

// ── PWA ──────────────────────────────────────────────────────────────────────

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

// ── Boot ─────────────────────────────────────────────────────────────────────

loadData().catch(err => {
  $loading.querySelector("p").textContent = "Failed to load data. Please refresh.";
  console.error(err);
});
</script>
</body>
</html>
